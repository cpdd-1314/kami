<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡密验证</title>
<link rel="stylesheet" href="/static/style.css">
<style>
@media (max-width: 720px) {
  header { padding: 20px 16px; }
  h1 { font-size: 22px !important; }
  .grid { grid-template-columns: 1fr !important; gap: 12px; padding: 0 4px; }
  #overlay > div, .modal { padding: 26px 20px !important; }
  .modal h2 { font-size: 19px; }
  .modal input { font-size: 16px !important; }
}
</style>
</head>
<body>
  <div id="page-content" class="blurred">
    <header>
      <h1>✨ 会员专区</h1>
      <p>这里是受保护的内容区域，验证卡密后即可查看</p>
    </header>
    <main class="grid">
      <div class="content-card"><h3>📄 精选资源</h3><p>这是解锁后的内容示例一。您可以在此放置任意受保护的页面内容。</p></div>
      <div class="content-card"><h3>🎬 专属视频</h3><p>这是解锁后的内容示例二。支持文字、图片、视频等任意内容。</p></div>
      <div class="content-card"><h3>📦 下载专区</h3><p>这是解锁后的内容示例三。管理后台可批量生成卡密。</p></div>
    </main>
  </div>

  <div id="overlay">
    <div class="modal" id="modal">
      <div class="modal-icon">🔑</div>
      <h2>请输入卡密</h2>
      <p class="sub">验证通过后即可查看本页内容</p>
      <input id="code-input" placeholder="XXXX-XXXX-XXXX-XXXX" autocomplete="off">
      <button id="verify-btn">验 证</button>
      <p id="msg"></p>
    </div>
  </div>

<script>
(function () {
  var KC = 'kami_code';
  var SITE = {{ site|tojson }};
  function fmtExp(e) { return e ? '有效期至 ' + e.replace('T', ' ').slice(0, 16) : '永久有效'; }
  function toast(txt) {
    var t = document.createElement('div');
    t.style.cssText = 'position:fixed;left:50%;top:24px;transform:translateX(-50%);z-index:99999;background:#16a34a;color:#fff;padding:12px 22px;border-radius:10px;font-size:15px;box-shadow:0 8px 30px rgba(0,0,0,.25);';
    t.textContent = txt;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 3000);
  }
  var input = document.getElementById('code-input'),
      btn = document.getElementById('verify-btn'),
      msg = document.getElementById('msg'),
      overlay = document.getElementById('overlay'),
      content = document.getElementById('page-content');

  function body(code, api) {
    return api + '=' + encodeURIComponent(code) + '&site=' + encodeURIComponent(SITE);
  }
  function call(api, code, cb) {
    fetch('/api/' + api, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'code=' + encodeURIComponent(code) + '&site=' + encodeURIComponent(SITE)
    })
    .then(function (r) { return r.json(); }).then(cb)
    .catch(function () { cb({ ok: false, message: '网络错误，请重试' }); });
  }
  function unlock() {
    overlay.style.display = 'none';
    content.classList.remove('blurred');
  }
  function showOverlay(tip) {
    overlay.style.display = 'flex';
    content.classList.add('blurred');
    if (tip) { msg.style.color = '#ef4444'; msg.textContent = tip; }
    input.focus();
  }
  function shake() {
    input.style.borderColor = '#ef4444';
    var modal = document.getElementById('modal'), n = 0;
    var t = setInterval(function () {
      n++; modal.style.transform = 'translateX(' + (n % 2 ? -7 : 7) + 'px)';
      if (n > 5) { clearInterval(t); modal.style.transform = ''; }
    }, 60);
  }
  function submit() {
    var code = input.value.trim();
    if (!code) { msg.textContent = '请输入卡密'; shake(); return; }
    btn.disabled = true; btn.textContent = '验证中...';
    call('verify', code, function (d) {
      if (d.ok) {
        try { localStorage.setItem(KC, code); } catch (e) {}
        msg.style.color = '#22c55e';
        msg.textContent = '✓ 卡密有效';
        unlock();
        toast('✓ 卡密有效，' + fmtExp(d.expire_at));
      } else {
        msg.style.color = '#ef4444';
        msg.textContent = d.message || '卡密无效';
        shake();
      }
      btn.disabled = false; btn.textContent = '验 证';
    });
  }
  // 每次进入都向服务器校验一次保存的卡密（过期立即弹窗）
  var saved = null;
  try { saved = localStorage.getItem(KC); } catch (e) {}
  if (saved) {
    call('check', saved, function (d) {
      if (d.ok) { unlock(); toast('✓ 卡密有效，' + fmtExp(d.expire_at)); }
      else showOverlay(d.message);
    });
  }

  btn.onclick = submit;
  input.onkeydown = function (e) { if (e.key === 'Enter') submit(); };
  input.oninput = function () { input.style.borderColor = '#dcdff0'; msg.textContent = ''; };
})();
</script>
</body>
</html>
