<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理员登录 - 卡密系统</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="admin-body">
  <div class="login-wrap">
    <div class="modal">
      <div class="modal-icon">🛡️</div>
      <h2>管理员登录</h2>
      <input id="username" placeholder="用户名" autocomplete="off">
      <input id="password" type="password" placeholder="密码">
      <button id="login-btn">登 录</button>
      <p id="msg"></p>
    </div>
  </div>
<script>
var btn = document.getElementById('login-btn');
btn.onclick = function () {
  fetch('/admin/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: 'username=' + encodeURIComponent(document.getElementById('username').value)
        + '&password=' + encodeURIComponent(document.getElementById('password').value)
  })
  .then(function (r) { return r.json(); })
  .then(function (d) { if (d.ok) location.href = '/admin/dashboard'; else document.getElementById('msg').textContent = d.message; });
};
document.getElementById('password').onkeydown = function (e) { if (e.key === 'Enter') btn.click(); };
</script>
</body>
</html>
