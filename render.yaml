services:
  - type: web
    name: kami
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: KAMI_DB_PATH
        value: /opt/render/project/src/kami.db
    healthCheckPath: /
